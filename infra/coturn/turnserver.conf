# Konvo Platform — coturn TURN/STUN config
#
# Authored in task 1.7 (Phase 0). Satisfies Requirement 17.1 by giving the
# `coturn` service in infra/docker-compose.yml a config file at the path it
# already mounts (`./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro`).
#
# Role (per design §3.4 and the Media Plane diagram in §2):
#   - coturn is STUN/TURN-only relay for 1:1 WebRTC DM calls.
#   - It is NEVER used for broadcast room A/V (that goes through LiveKit).
#   - Media stays end-to-end encrypted via DTLS-SRTP between browsers.
#     coturn relays opaque encrypted UDP and never sees plaintext frames.
#
# The API_Gateway mints short-lived TURN credentials using the REST auth
# secret model (RFC 7635). The shared secret below MUST match the value
# the api signs ephemeral usernames with (env var `COTURN_AUTH_SECRET` on
# the api side; see task 1.8 boot-time secret validation).

# ─── Listening sockets ────────────────────────────────────────────────────────
# Plain UDP/TCP TURN. TLS TURN (turns://) is not enabled in dev because
# self-signed certs add friction; production deployments terminate TLS at
# Caddy or provision real certs and uncomment `tls-listening-port` plus the
# cert/pkey lines below.
listening-port=3478
# tls-listening-port=5349

# Bind to all interfaces inside the container; docker publishes the port.
listening-ip=0.0.0.0

# ─── Auth (REST API / time-limited credentials, RFC 7635) ─────────────────────
# `use-auth-secret` enables the long-term credential mechanism with a shared
# secret. Clients receive `username = <unix-ts>:<userId>` and
# `password = base64(HMAC-SHA1(secret, username))` from the api when they
# request ICE servers; coturn validates the HMAC against `static-auth-secret`.
use-auth-secret

# WARNING: this is a development placeholder. coturn does NOT perform env
# variable interpolation on this file, so the secret has to be embedded
# literally. Production deployments MUST regenerate this file from a template
# at deploy time (e.g. envsubst) and replace the value below with a strong
# random secret of >= 32 bytes. The api's `COTURN_AUTH_SECRET` env var must
# match exactly or all TURN auth will fail.
static-auth-secret=replace-me-coturn-dev-secret-do-not-use-in-prod

# Realm presented in TURN Allocate responses. Override per deployment.
# In production this should be the operator's domain (e.g. `konvo.example.com`).
realm=konvo.local

# Reject stale nonces older than 10 minutes (default 600s).
stale-nonce=600

# ─── Quotas & resource limits ─────────────────────────────────────────────────
# Cap concurrent allocations to keep the dev box well-behaved. Operators
# should raise this for production based on expected concurrent 1:1 calls.
total-quota=100

# 0 disables per-session bandwidth cap. Set a positive value (bytes/sec) in
# production if abuse is a concern.
bps-capacity=0

# ─── Relay port range ─────────────────────────────────────────────────────────
# Narrow window so docker-compose can publish the exact UDP range the
# compose file already exposes (49152–49200). Widen for production.
min-port=49152
max-port=49200

# ─── Hardening ────────────────────────────────────────────────────────────────
# Refuse to relay to multicast/loopback addresses; prevents abuse of the
# server as an internal-network probe or amplification vector.
no-multicast-peers
no-loopback-peers

# Disable the cleartext CLI (port 5766). We don't need runtime introspection
# for a single-tenant deployment, and leaving it open is a footgun.
no-cli

# Add STUN FINGERPRINT attribute to all responses; required by some browsers.
fingerprint

# ─── TLS certificates (production) ────────────────────────────────────────────
# Uncomment along with `tls-listening-port=5349` once real certs are mounted.
# The compose file exposes 5349/tcp+udp already so flipping this on is a
# config change only — no compose edits required.
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem
